name: Build HarmonyOS Release
on:
  workflow_dispatch:
    inputs:
      agcReleaseType:
        description: 'AGC 发布类型（1=正式版本，3=开放式测试）'
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '3'

jobs:
  build-harmony:
    # 鸿蒙 Kotlin/Native 预编译 LLVM (ld.lld) 依赖 libxml2.so.2，固定使用 Ubuntu 24.04 LTS。
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 确保系统运行库就绪 (libxml2.so.2)
        run: |
          set -euo pipefail
          if ! ldconfig -p | grep -q 'libxml2\.so\.2'; then
            sudo apt-get update
            sudo apt-get install -y libxml2
          fi

      - name: 设置 JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'

      - name: 解析版本号
        id: version
        run: |
          set -euo pipefail
          versionName=$(sed -nE 's/^[[:space:]]*app-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          versionCode=$(git rev-list HEAD --count)
          if [ -z "$versionName" ]; then
            echo "无法从 gradle/libs.versions.toml 解析 app-version"
            exit 1
          fi
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "构建鸿蒙版本: $versionName ($versionCode)"

      - name: 安装鸿蒙 Command Line Tools (26.0.0.821)
        uses: ErBWs/setup-ohos@v2.0.0
        with:
          version: '26.0.0.821'
          cache: true

      - name: 配置鸿蒙 SDK 环境变量
        run: |
          echo "DEVECO_SDK_HOME=$HOS_SDK_HOME" >> "$GITHUB_ENV"
          echo "OHOS_SDK_HOME=$HOS_SDK_HOME/default/openharmony" >> "$GITHUB_ENV"

      - name: 缓存 Kotlin/Native 与 ohpm 依赖
        uses: actions/cache@v6
        with:
          path: |
            ~/.konan
            ~/.ohpm/cache
          key: harmony-toolchains-${{ runner.os }}-${{ hashFiles('harmonyApp/kotlin/gradle/libs.versions.toml', 'harmonyApp/oh-package.json5', 'harmonyApp/entry/oh-package.json5') }}
          restore-keys: |
            harmony-toolchains-${{ runner.os }}-
          save-always: true

      - name: 安装鸿蒙 ohpm 依赖
        working-directory: harmonyApp
        run: |
          set -euo pipefail
          ohpm config set retry_times 5
          ohpm config set retry_interval 3000
          ohpm config set fetch_timeout 120000
          for registry in "https://repo.harmonyos.com/ohpm/" "https://ohpm.openharmony.cn/ohpm/"; do
            echo "尝试使用 ohpm 镜像源安装依赖: $registry"
            ohpm config set registry "$registry"
            if ohpm install --all; then
              exit 0
            fi
            echo "镜像源 $registry 安装失败，稍后切换重试..."
            sleep 5
          done
          echo "::error::所有 ohpm 镜像源均安装失败"
          exit 1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 编译共享 Kotlin 原生库 (ohosArm64 Release)
        working-directory: harmonyApp/kotlin
        env:
          GITHUB_USERNAME: ${{ secrets.NEXUS_USER }}
          GITHUB_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -PharmonyArch=arm64 :loggerChecks:test :composeApp:publishReleaseOhosArm64 --console=plain

      - name: 构建未签名 Release .app
        working-directory: harmonyApp
        run: |
          set -euo pipefail
          hvigorw clean --no-daemon
          hvigorw assembleApp --mode project -p product=default -p buildMode=release --no-daemon

      - name: 签名并校验 Release .app 产物
        id: artifact
        env:
          HARMONY_SIGN_P12_BASE64: ${{ secrets.HARMONY_SIGN_P12_BASE64 }}
          HARMONY_SIGN_CER_BASE64: ${{ secrets.HARMONY_SIGN_CER_BASE64 }}
          HARMONY_SIGN_P7B_BASE64: ${{ secrets.HARMONY_SIGN_P7B_BASE64 }}
          HARMONY_SIGN_KEY_ALIAS: ${{ secrets.HARMONY_SIGN_KEY_ALIAS }}
          HARMONY_SIGN_STORE_PASSWORD: ${{ secrets.HARMONY_SIGN_STORE_PASSWORD }}
          HARMONY_SIGN_KEY_PASSWORD: ${{ secrets.HARMONY_SIGN_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/harmony-signing"
          mkdir -p "$SIGN_DIR"
          for name in HARMONY_SIGN_P12_BASE64 HARMONY_SIGN_CER_BASE64 HARMONY_SIGN_P7B_BASE64 HARMONY_SIGN_KEY_ALIAS HARMONY_SIGN_STORE_PASSWORD HARMONY_SIGN_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少鸿蒙发布签名 Secret: $name"
              exit 1
            fi
          done
          printf '%s' "$HARMONY_SIGN_P12_BASE64" | base64 --decode > "$SIGN_DIR/release.p12"
          printf '%s' "$HARMONY_SIGN_CER_BASE64" | base64 --decode > "$SIGN_DIR/release.cer"
          printf '%s' "$HARMONY_SIGN_P7B_BASE64" | base64 --decode > "$SIGN_DIR/release.p7b"

          UNSIGNED_APP=$(find harmonyApp/build/outputs/default -maxdepth 2 -type f -name '*-unsigned.app' | head -n 1)
          if [ -z "$UNSIGNED_APP" ]; then
            UNSIGNED_APP=$(find harmonyApp/build/outputs/default -maxdepth 2 -type f -name '*.app' | head -n 1)
          fi
          if [ -z "$UNSIGNED_APP" ]; then
            echo "::error::未找到编译生成的 .app 文件"
            find harmonyApp/build -maxdepth 4 -type f || true
            exit 1
          fi

          SIGN_TOOL="$OHOS_SDK_HOME/toolchains/lib/hap-sign-tool.jar"
          if [ ! -f "$SIGN_TOOL" ]; then
            echo "::error::未找到 hap-sign-tool.jar: $SIGN_TOOL"
            exit 1
          fi

          OUT_NAME="XhuTimetable-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.versionCode }}-harmony-release.app"
          OUT_PATH="$RUNNER_TEMP/$OUT_NAME"

          java -jar "$SIGN_TOOL" sign-app \
            -mode localSign \
            -keystoreFile "$SIGN_DIR/release.p12" \
            -keystorePwd "$HARMONY_SIGN_STORE_PASSWORD" \
            -keyAlias "$HARMONY_SIGN_KEY_ALIAS" \
            -keyPwd "$HARMONY_SIGN_KEY_PASSWORD" \
            -signAlg SHA256withECDSA \
            -profileFile "$SIGN_DIR/release.p7b" \
            -appCertFile "$SIGN_DIR/release.cer" \
            -inFile "$UNSIGNED_APP" \
            -outFile "$OUT_PATH"

          java -jar "$SIGN_TOOL" verify-app \
            -inFile "$OUT_PATH" \
            -outCertChain "$SIGN_DIR/verified-cert.cer" \
            -outProfile "$SIGN_DIR/verified-profile.p7b"

          SHA256=$(sha256sum "$OUT_PATH" | cut -d' ' -f1)
          echo "filePath=$OUT_PATH" >> "$GITHUB_OUTPUT"
          echo "fileName=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          {
            echo "### 鸿蒙 Release 构建产物"
            echo "- 版本号: \`${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.versionCode }})\`"
            echo "- 文件名: \`$OUT_NAME\`"
            echo "- SHA-256: \`$SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 校验 AGC 上传脚本测试
        run: python3 -m unittest discover -s harmonyApp/scripts -p 'test_*.py'

      - name: 上传到华为 AppGallery Connect
        env:
          AGC_CLIENT_ID: ${{ secrets.AGC_CLIENT_ID }}
          AGC_CLIENT_SECRET: ${{ secrets.AGC_CLIENT_SECRET }}
          AGC_APP_ID: ${{ secrets.AGC_APP_ID }}
        run: |
          set -euo pipefail
          for name in AGC_CLIENT_ID AGC_CLIENT_SECRET AGC_APP_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::缺少华为 AGC 上传 Secret: $name（请在仓库 Settings -> Secrets and variables -> Actions 中配置）"
              exit 1
            fi
          done
          python3 harmonyApp/scripts/upload_agc.py \
            --file "${{ steps.artifact.outputs.filePath }}" \
            --release-type "${{ inputs.agcReleaseType }}"

      - name: 上传 Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: harmony-release-app-${{ steps.version.outputs.versionName }}-${{ steps.version.outputs.versionCode }}
          path: ${{ steps.artifact.outputs.filePath }}
